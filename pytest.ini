[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --strict-markers

# Live logging: INFO+ messages from tests appear in the output.
# Lower to DEBUG on the command line with: pytest --log-cli-level=DEBUG
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)-8s %(name)s: %(message)s
